aid: geneoscopy
name: Geneoscopy
description: 'Geneoscopy is a commercial-stage molecular diagnostics company headquartered
  in St. Louis, Missouri, focused on gastrointestinal health. Its platform analyzes stool-derived
  eukaryotic RNA (seRNA) biomarkers, a proprietary approach the company applies to colorectal
  cancer screening, inflammatory bowel disease and other gastrointestinal conditions.
  Its lead product, ColoSense, is a noninvasive multi-target stool RNA (mt-sRNA) colorectal
  cancer screening test approved by the FDA in May 2024 for adults aged 45 and older at
  average risk; it evaluates eight colorectal neoplasia-associated RNA markers together
  with occult hemoglobin, and has since been added to the American Cancer Society and NCCN
  colorectal cancer screening guidelines. Geneoscopy operates a CLIA-certified (26D2253457)
  and CAP-accredited clinical laboratory with permits in New York, California, Maryland,
  Pennsylvania, Rhode Island and the District of Columbia, and partners with biopharma and
  research organizations on stool-biomarker diagnostics and prognostics. Geneoscopy is a
  diagnostics and clinical-laboratory company; as of this profile it publishes no public
  developer API, SDK, developer portal, or machine-readable API contract.'
